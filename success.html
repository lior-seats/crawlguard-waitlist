<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're subscribed — CrawlGuard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .card { background: #111; border: 1px solid #1e1e1e; border-radius: 16px; padding: 3rem 2.5rem; max-width: 480px; width: 100%; text-align: center; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.75rem; color: #f0f0f0; }
    p { color: #888; line-height: 1.7; margin-bottom: 1rem; font-size: 0.95rem; }
    .highlight { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1.25rem 1.5rem; margin: 1.5rem 0; text-align: left; font-size: 0.9rem; color: #bbb; line-height: 1.6; }
    a { color: #e94560; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>You're subscribed!</h1>
    <p>Your CrawlGuard Pro subscription is confirmed. You'll receive a receipt from Stripe shortly.</p>

    <div class="highlight">
      <strong style="color:#f0f0f0">What happens next</strong><br><br>
      We'll email you within 24 hours with your account setup details and instructions to connect your site.
    </div>

    <p style="font-size:0.85rem;margin-top:1rem">
